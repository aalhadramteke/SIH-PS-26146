[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-transaction-monitoring"
version = "0.1.0"
description = "Reproducible synthetic Bitcoin transaction data for monitoring prototypes"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "networkx>=3.0",
  "streamlit>=1.35",
  "plotly>=5.18",
  "pyvis>=0.3.2",
  "lxml>=5.0",
]

[project.scripts]
btc-synth = "bitcoin_monitoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
